; Extensiones SIP de prueba para llamar al AGI desde un softphone (Linphone, Zoiper, MicroSIP...).
; Si ya tienes extensiones del Taller 1, no necesitas este archivo: solo asegúrate de que su
; contexto sea [agi-auth] o que incluya "include => agi-auth".
; Se agrega al final de /etc/asterisk/pjsip.conf (o con #include) y se recarga con:
;   sudo asterisk -rx "module reload res_pjsip.so"

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[6001]
type=endpoint
context=agi-auth          ; con esto la extensión ya puede marcar 700
disallow=all
allow=ulaw,alaw           ; g711 porque los audios son de 8 kHz
auth=6001
aors=6001
dtmf_mode=rfc4733         ; clave para que los dígitos del teclado lleguen al AGI
direct_media=no

[6001]
type=auth
auth_type=userpass
username=6001
password=Prueba6001       ; cámbiala; esta es solo la clave SIP del softphone

[6001]
type=aor
max_contacts=1
