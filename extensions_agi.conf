; Contexto aparte para no tocar el resto del dialplan.
; Se enchufa con "include => agi-auth" dentro del contexto de las extensiones.
[agi-auth]
exten => 700,1,NoOp(Sistema de autenticacion por AGI con Google TTS)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(CHANNEL(language)=es)
 same => n,AGI(auth.py)
 same => n,Hangup()

; Frase suelta para comprobar que el sintetizador responde, sin login.
exten => 702,1,NoOp(Prueba del AGI de Google)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(googletts.agi,"Prueba de voz de Google. Si escucha esta frase la autenticación funciona.",es)
 same => n,Hangup()
