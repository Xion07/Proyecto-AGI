; Lo dejé en un contexto aparte para no tocar el resto del dialplan.
; Se enchufa con "include => agi-auth" dentro del contexto de tus extensiones.
[agi-auth]
exten => 700,1,NoOp(Sistema de autenticacion por AGI)
 same => n,Answer()
 same => n,Wait(1)            ; un segundo para que el audio no arranque cortado
 same => n,AGI(auth.py)
 same => n,Hangup()
